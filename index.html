<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="img/logo.png" type = "image/x-icon">
        <link rel="stylesheet" href="main.css">
        <title>Calcolator</title>
    </head>

    <body>

        <header>

            <div class = "history-Data-Continar">

                <button id="history-btn" onclick="RotateAnimation();">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f9fbff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"></polyline>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                    </svg>
                </button>

                <div id ="history-screen">
                    <h4 id = "history-screen-title">History</h4>
                    <p class = "note">Tap any operation to reuse the result</p>

                    <div id = "history-cards">

                    </div>

                    <button class="clear-the-history" onclick="clearHistory();">Clear History</button>

                </div>
            </div>
            
            <div class="continar" id = "calcolator-body">
                

                <input type="text" readonly>
                
                <div class = "btn btn1 order" onclick="clearDisplay();">
                    <button>ِAC</button>
                </div>

                <div class = "btn btn2 order" onclick="modlesDisplay(myElement.value);">
                    <button>%</button>
                </div>

                <div class = "btn btn3 order" onclick="powDisplay();">
                    <button>x²</button>
                </div>
                
                <div class = "btn btn4 order" onclick="deleteValue(myElement.value);">
                    <button>⌫</button>
                </div>

                <div class = "btn btn5 order" onclick="addValue(`(`);">
                    <button>(</button>
                </div>
                
                <div class = "btn btn6 order" onclick="addValue(`)`)">
                    <button>)</button>
                </div>
                
                <div class = "btn btn7 operator" onclick="addValue(`÷`);">
                    <button>÷</button>
                </div>
                
                <div class = "btn btn8 operator" onclick="addValue(`×`);">
                    <button>×</button>
                </div>

                <div class = "btn btn9" onclick="addValue(7);">
                    <button>7</button>
                </div>

                <div class = "btn btn10" onclick="addValue(8);">
                    <button>8</button>
                </div>

                <div class = "btn btn11" onclick="addValue(9);">
                    <button>9</button>
                </div>

                <div class = "btn btn12 operator" onclick="addValue(`-`);">
                    <button>-</button>
                </div>
                
                <div class = "btn btn13" onclick="addValue(4);">
                    <button>4</button>
                </div>

                <div class = "btn btn14" onclick="addValue(5);" >
                    <button>5</button>
                </div>

                <div class = "btn btn15" onclick="addValue(6);">
                    <button>6</button>
                </div>

                <div class = "btn btn16 operator" onclick="addValue(`+`);">
                    <button>+</button>
                </div>

                <div class = "btn btn17" onclick="addValue(1);">
                    <button>1</button>
                </div>

                <div class = "btn btn18" onclick="addValue(2);">
                    <button>2</button>
                </div>

                <div class = "btn btn19" onclick="addValue(3);">
                    <button>3</button>
                </div>
                
                <div class = "btn btn20" onclick="Switch();">
                    <button>+/-</button>
                </div>
                
                <div class = "btn btn21" onclick="addValue(0);">
                    <button>0</button>
                </div>
                
                <div class = "btn btn22" onclick="addValue(`.`);">
                    <button>.</button>
                </div>
                
                <div class = "btn special operator" onclick="myElement.value = calc4(myElement.value); updateHisstoryUi();">
                    <button>=</button>
                </div>
                
            </div>

        </header>

        <script src="main.js"></script>
    </body>

</html>
